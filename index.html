<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24点 - 联网对战版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #4CAF50; --secondary: #2196F3; --bg: #f4f7f6; --card-bg: #fff; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; -webkit-tap-highlight-color: transparent; }
        
        /* Loading 遮罩 */
        #loading-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.3s;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ...这里需要粘贴之前 V3 版本的 CSS (Style部分)... */
        /* 为了演示完整性，请将 V3 版本的 CSS 复制到这里 */
        /* 简单补充核心样式以保证代码可运行 */
                :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --accent: #FF9800;
            --bg: #f4f7f6;
            --card-bg: #fff;
            --text-main: #333;
            --gap-size: 15px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* 禁止移动端长按选中文本 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 顶部栏 --- */
        .top-bar {
            width: 100%;
            background: #fff;
            padding: 12px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .user-pill {
            display: flex;
            align-items: center;
            background: #eef2f5;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
        }
        .user-pill .score { color: var(--secondary); margin-left: 5px; }

        .top-actions button {
            background: none;
            border: none;
            font-size: 20px;
            padding: 5px 10px;
            cursor: pointer;
        }

        /* --- 游戏主区域 --- */
        .game-header { text-align: center; margin-top: 2vh; }
        .game-header h1 { margin: 0; font-size: 24px; color: #444; }
        .game-header p { margin: 5px 0 0; color: #888; font-size: 13px; }

        .message-area {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            transition: all 0.3s;
        }
        .msg-success { color: var(--primary); transform: scale(1.1); }
        .msg-error { color: #E91E63; }

        /* 卡牌容器：使用 Flexbox 实现响应式布局 */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 3vw; /* 间距随屏幕变 */
            width: 100%;
            padding: 20px 0;
            min-height: 180px; /* 留出足够高度 */
            align-items: center;
        }

        .card {
            /* 响应式大小：在手机上大，iPad上合适 */
            width: 20vw;
            height: 28vw;
            max-width: 100px;
            max-height: 140px;
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        /* 选中的卡牌 */
        .card.selected {
            background-color: #FFF9C4; /* 浅黄 */
            border-color: var(--accent);
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
            z-index: 10;
        }

        .card .expr {
            font-size: 12px;
            color: #888;
            font-weight: normal;
            position: absolute;
            bottom: 8px;
            width: 90%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 底部按钮区 --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: auto;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: active 0.1s;
            /* 移动端触摸优化 */
            min-width: 100px;
            touch-action: manipulation; 
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-warn { background: var(--accent); color: white; }
        .btn-sub { background: #fff; color: #555; border: 1px solid #eee; }

        /* --- 弹窗 (Modal) --- */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 99; backdrop-filter: blur(3px);
        }
        .modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; width: 85%; max-width: 360px;
            border-radius: 20px; padding: 25px;
            z-index: 100; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* 运算选择器布局 */
        .op-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .op-btn {
            background: #f8f9fa; border: 1px solid #eee;
            padding: 15px 5px; border-radius: 12px;
            font-size: 16px; font-weight: 500;
            color: #333;
        }
        .op-btn b { font-size: 18px; color: var(--secondary); }
        .op-btn:active { background: #e3f2fd; border-color: var(--secondary); }

        /* 登录 & 用户列表 */
        .user-input {
            width: 100%; padding: 12px; font-size: 18px;
            border: 2px solid #eee; border-radius: 10px;
            margin: 15px 0; box-sizing: border-box; text-align: center;
        }
        .user-input:focus { border-color: var(--secondary); outline: none; }

        .quick-users {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px;
        }
        .user-tag {
            background: #e0f7fa; color: #006064;
            padding: 6px 12px; border-radius: 15px; font-size: 13px;
            cursor: pointer; border: 1px solid transparent;
        }
        .user-tag:active { background: #b2ebf2; }

        /* 排行榜 */
        .rank-list { list-style: none; padding: 0; margin: 10px 0; max-height: 50vh; overflow-y: auto; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 5px; border-bottom: 1px solid #eee;
            cursor: pointer; /* 可点击 */
        }
        .rank-item:active { background-color: #f5f5f5; }
        .rank-info { display: flex; align-items: center; gap: 10px; }
        .rank-num { width: 24px; font-weight: bold; color: #999; }
        .rank-1 .rank-num { color: #FFD700; font-size: 1.2em; }
        .rank-2 .rank-num { color: #90A4AE; font-size: 1.1em; }
        .rank-3 .rank-num { color: #CD7F32; font-size: 1.1em; }
        .switch-hint { font-size: 10px; color: var(--primary); background: #e8f5e9; padding: 2px 6px; border-radius: 4px; display: none;}
        .rank-item:hover .switch-hint { display: inline-block; } /* PC hover */

        .top-bar { width: 100%; padding: 10px; background: #fff; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box;}
        .cards-container { display: flex; gap: 10px; padding: 20px; justify-content: center; min-height: 150px;}
        .card { width: 80px; height: 110px; background: #fff; border: 2px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; position: relative;}
        .card.selected { background: #fff9c4; border-color: orange; transform: scale(1.1); }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; background: #ddd;}
        .btn-primary { background: var(--secondary); color: white; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 100; text-align: center; width: 80%; max-width: 300px;}
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 99;}
    </style>
</head>
<body>

    <div id="loading-mask">
        <div class="spinner"></div>
        <p id="loading-text" style="color:#666; margin-top:10px;">正在连接云端数据...</p>
    </div>

    <div class="top-bar">
        <div onclick="showLoginModal(true)" style="cursor:pointer">
            <span id="current-user-name">未登录</span>
            <span id="current-user-score" style="color:var(--secondary); font-weight:bold; margin-left:5px;"></span>
        </div>
        <div>
            <button onclick="showHistory()" style="background:none; border:none; font-size:20px;" title="历史记录">📅</button>
            <button onclick="fetchLeaderboard()" style="background:none; border:none; font-size:20px;">🏆</button>
        </div>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <h2 style="margin:0;">24 点 <span style="font-size:12px; color:#2196F3; border:1px solid #2196F3; border-radius:4px; padding:0 4px;">联网版</span></h2>
    </div>

    <div id="message" style="height:30px; text-align:center; margin:10px; font-weight:bold; color:var(--primary);"></div>
    <div class="cards-container" id="game-area"></div>

    <div class="controls">
        <button onclick="resetGame()">重置</button>
        <button onclick="customGame()" style="background:#ff9800; color:white">自定义</button>
        <button class="btn-primary" onclick="newGame()">跳过</button>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    
    <div class="modal" id="login-modal">
        <h3>👋 登录 / 注册</h3>
        <p style="font-size:12px; color:#888;">输入名字，数据自动同步到云端</p>
        <input type="text" id="username-input" placeholder="输入你的名字" style="padding:10px; width:80%; margin-bottom:10px;">
        <button class="btn-primary" onclick="handleCloudLogin()">进入游戏</button>
    </div>
    <div class="modal" id="login-modal">
        <h2>👋 谁在玩?</h2>
        <input type="text" id="username-input" class="user-input" placeholder="输入名字 (不区分大小写)" maxlength="12">
        
        <div id="quick-login-area" style="display:none; margin-bottom: 15px;">
            <p style="font-size:12px; color:#888; margin:5px;">或选择已有用户:</p>
            <div class="quick-users" id="existing-users-list"></div>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">确定</button>
    </div>

    <div class="modal" id="history-modal">
        <h2 id="history-title">📅 记录</h2>
        <ul class="rank-list" id="history-list"></ul>
        <button class="btn btn-sub" style="margin-top:15px; width:100%" onclick="closeModal()">关闭</button>
    </div>
    <div class="modal" id="leaderboard-modal">
        <h3>🏆 云端排行榜</h3>
        <ul id="rank-list" style="list-style:none; padding:0; max-height: 200px; overflow-y:auto; text-align:left;"></ul>
        <button onclick="closeModal()" style="margin-top:10px; width:100%;">关闭</button>
    </div>

    <div class="modal" id="op-menu">
        <h3>选择运算</h3>
        <div id="op-list" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>

<script>
    // ==========================================
    // ☁️ 1. 云端配置区域 (请修改这里!)
    // ==========================================
    const SUPABASE_URL = 'https://yqvpkigmzcgmtqswhfqn.supabase.co'; // 替换为你的 URL
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxdnBraWdtemNnbXRxc3doZnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5NjM0NjIsImV4cCI6MjA3OTUzOTQ2Mn0.jXeriWWLII6mx_-Gx-EkhALHNAZJ7iP89x4FvqTN0cQ';                // 替换为你的 Key
    // ==========================================

    const supabaselocal = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const TARGET = 24;
    
    // 游戏状态
    let currentUser = null; // { username: 'Alice', score: 100, history: {} }
    let game = { cards: [], selected: [], initial: [], locked: false, isCustom: false, idCounter: 0 };

    window.onload = async () => {
        // 尝试从本地记住上次登录的名字
        const lastUser = localStorage.getItem('game24_last_user');
        if (lastUser) {
            await syncUser(lastUser);
        } else {
            hideLoading();
            showLoginModal(false);
        }
    };

    // --- ☁️ 云端核心逻辑 ---

    async function syncUser(name) {
        showLoading(`正在同步 ${name} 的数据...`);
        try {
            // 1. 尝试获取用户
            let { data, error } = await supabaselocal.from('scores').select('*').eq('username', name).single();
            
            if (!data) {
                // 2. 如果用户不存在，创建新用户
                const newUser = { username: name, total_score: 0, history: {} };
                const { error: insertError } = await supabaselocal.from('scores').insert([newUser]);
                if (insertError) throw insertError;
                currentUser = newUser;
            } else {
                currentUser = data;
            }

            // 登录成功
            localStorage.setItem('game24_last_user', name);
            updateUserUI();
            hideLoading();
            closeModal();
            if(game.cards.length === 0) newGame();

        } catch (err) {
            console.error(err);
            alert("网络连接失败，请检查配置或网络");
            hideLoading();
            showLoginModal(false);
        }
    }

    async function uploadScore(points) {
        if (!currentUser) return;
        
        // 更新本地状态
        const today = new Date().toISOString().slice(0, 10);
        currentUser.total_score += points;
        currentUser.history = currentUser.history || {};
        currentUser.history[today] = (currentUser.history[today] || 0) + points;
        
        updateUserUI(); // 界面立即更新，无需等待网络

        // 异步上传云端
        const { error } = await supabaselocal
            .from('scores')
            .update({ 
                total_score: currentUser.total_score,
                history: currentUser.history,
                updated_at: new Date()
            })
            .eq('username', currentUser.username);
            
        if (error) console.error("上传分数失败", error);
    }

    async function fetchLeaderboard() {
        showLoading("加载排行榜...");
        const { data, error } = await supabaselocal
            .from('scores')
            .select('username, total_score')
            .order('total_score', { ascending: false })
            .limit(20);

        hideLoading();
        if (error) return alert("加载失败");

        const list = document.getElementById('rank-list');
        list.innerHTML = '';
        data.forEach((u, i) => {
            const li = document.createElement('li');
            li.style.padding = "8px 0";
            li.style.borderBottom = "1px solid #eee";
            li.innerHTML = `
                <span style="font-weight:bold; color:#888; width:20px; display:inline-block">${i+1}</span>
                <span>${u.username}</span>
                <span style="float:right; font-weight:bold; color:var(--primary)">${u.total_score}</span>
            `;
            
            // 点击排行榜直接切换 (修改点2)
            li.onclick = () => {
                if (u.username !== currentUser.username) {
                    if(confirm(`切换身份为 "${u.username}" ?`)) {
                        syncUser(u.username);
                        closeModal();
                    }
                }
            };
            list.appendChild(li);
        });
        openModal('leaderboard-modal');
    }

    // --- UI 逻辑 ---
    function handleCloudLogin() {
        const name = document.getElementById('username-input').value.trim();
        if(!name) return alert("请输入名字");
        syncUser(name);
    }

    function updateUserUI() {
        if(currentUser) {
            document.getElementById('current-user-name').innerText = currentUser.username;
            document.getElementById('current-user-score').innerText = currentUser.total_score;
        }
    }

    function showLoading(txt) {
        document.getElementById('loading-mask').style.display = 'flex';
        document.getElementById('loading-text').innerText = txt;
    }
    function hideLoading() {
        document.getElementById('loading-mask').style.opacity = '0';
        setTimeout(()=>document.getElementById('loading-mask').style.display='none', 300);
    }

    // --- 游戏逻辑 (简化版，直接复用之前的算法) ---
    // 为节省长度，这里省略了 solve() 算法的具体实现，请将之前 V3 版本中的
    // solve(), initGame(), renderGame(), onCardClick(), showOperatorMenu(), doMath(), fmt()
    // 等函数完整复制到这里。
        /* --- 求解算法 (DFS) --- */
    function newGame() {
        game.isCustom = false;
        game.locked = false;
        // 生成必定有解的题
        while(true) {
            let nums = Array.from({length:4}, () => Math.floor(Math.random()*13)+1);
            if(solve(nums.map(n=>({val:n})))) {
                initGame(nums);
                break;
            }
        }
    }
    function customGame() {
        let input = prompt("输入4个数字 (空格分隔):");
        if(!input) return;
        let nums = input.replace(/[,，]/g, ' ').trim().split(/\s+/).map(Number);
        if(nums.length!==4 || nums.some(isNaN)) return alert("格式错误，需要4个数字");
        
        game.isCustom = true;
        game.locked = false;
        initGame(nums);
        if(!solve(nums.map(n=>({val:n})))) showMsg("⚠️ 注意：这组数字无解", "error");
        else showMsg("自定义题目 (无积分)");
    }
    function resetGame() {
        game.locked = false;
        initGame(game.initial);
    }
    function showMsg(text, type = "") {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = 'message-area ' + (type === 'success' ? 'msg-success' : type === 'error' ? 'msg-error' : '');
    }
    function solve(nums) {
        if (nums.length === 0) return false;
        if (nums.length === 1) return Math.abs(nums[0].val - TARGET) < 0.001;
        for (let i = 0; i < nums.length; i++) {
            for (let j = 0; j < nums.length; j++) {
                if (i === j) continue;
                let rem = nums.filter((_, k) => k!==i && k!==j);
                let a = nums[i].val, b = nums[j].val;
                let cands = [a+b, a-b, a*b];
                if (Math.abs(b)>0.001) cands.push(a/b);
                for (let v of cands) if (solve([...rem, {val:v}])) return true;
            }
        }
        return false;
    }
    function initGame(nums) {
        game.initial = [...nums];
        game.idCounter = 0;
        game.cards = nums.map(n => ({ val: n, expr: n.toString(), id: game.idCounter++ }));
        game.selected = [];
        closeModal();
        renderGame();
        if(!game.isCustom) showMsg(""); 
    }
    
    function renderGame() {
        const container = document.getElementById('game-area');
        container.innerHTML = '';
        
        game.cards.forEach(c => {
            const div = document.createElement('div');
            const isSelected = game.selected.includes(c.id);
            div.className = `card ${isSelected ? 'selected' : ''}`;
            
            // 显示逻辑：如果是整数显示整数，小数保留2位
            let displayVal = parseFloat(c.val.toFixed(2));
            div.innerHTML = `<div>${displayVal}</div>`;
            
            // 如果表达式不是纯数字，显示表达式
            if (c.expr !== c.val.toString()) {
                div.innerHTML += `<div class="expr">${c.expr}</div>`;
            }

            div.onclick = () => onCardClick(c.id);
            container.appendChild(div);
        });
    }
    
    function onCardClick(id) {
        if (game.locked) return;

        const idx = game.selected.indexOf(id);
        if (idx >= 0) {
            game.selected.splice(idx, 1); // 取消选中
        } else {
            game.selected.push(id); // 选中
        }
        
        renderGame();

        if (game.selected.length === 2) {
            showOperatorMenu();
        } else if (game.selected.length > 2) {
            // 超过2个，保留最新的两个
            game.selected.shift();
            renderGame();
            showOperatorMenu();
        }
    }

    /* --- 运算逻辑 --- */
    function showOperatorMenu() {
        const [id1, id2] = game.selected;
        const c1 = game.cards.find(c => c.id === id1);
        const c2 = game.cards.find(c => c.id === id2);
        
        const list = document.getElementById('op-list');
        list.innerHTML = '';

        const ops = [
            { op: '+', res: c1.val + c2.val, txt: `${fmt(c1.val)} + ${fmt(c2.val)}` },
            { op: '-', res: c1.val - c2.val, txt: `${fmt(c1.val)} - ${fmt(c2.val)}` },
            { op: '-', res: c2.val - c1.val, txt: `${fmt(c2.val)} - ${fmt(c1.val)}`, swap: true },
            { op: '*', res: c1.val * c2.val, txt: `${fmt(c1.val)} × ${fmt(c2.val)}` },
            { op: '/', res: c1.val / c2.val, txt: `${fmt(c1.val)} ÷ ${fmt(c2.val)}`, check: c2.val },
            { op: '/', res: c2.val / c1.val, txt: `${fmt(c2.val)} ÷ ${fmt(c1.val)}`, check: c1.val, swap: true },
        ];

        ops.forEach(o => {
            if (o.check !== undefined && Math.abs(o.check) < 0.001) return; // 除数非0
            
            const btn = document.createElement('div');
            btn.className = 'op-btn';
            btn.innerHTML = `${o.txt} = <b>${fmt(o.res)}</b>`;
            btn.onclick = () => doMath(c1, c2, o.res, o.op, o.swap);
            list.appendChild(btn);
        });

        openModal('op-menu');
    }

    function doMath(c1, c2, val, op, swapped) {
        closeModal();
        
        // 构造新表达式
        let e1 = c1.expr, e2 = c2.expr;
        let newExpr = swapped ? `(${e2}${op}${e1})` : `(${e1}${op}${e2})`;
        
        // 预测新状态
        let nextCards = game.cards.filter(c => c.id !== c1.id && c.id !== c2.id);
        nextCards.push({ val: val, expr: newExpr, id: game.idCounter++ });

        // 死局检测
        if (nextCards.length > 1 && !solve(nextCards.map(c => ({val: c.val})))) {
             // 暂时显示一下让用户知道结果，然后报错
             game.cards = nextCards;
             game.selected = [];
             renderGame();
             game.locked = true;
             showMsg("❌ 这步走完无解了", "error");
             setTimeout(() => {
                 alert("死局！将自动重置本题。");
                 resetGame();
             }, 400);
             return;
        }

        // 更新状态
        game.cards = nextCards;
        game.selected = [];
        renderGame();

        // 检查胜利
        if (game.cards.length === 1) {
            if (Math.abs(game.cards[0].val - TARGET) < 0.001) {
                // 胜利逻辑 (修改点1：自动下一题)
                game.locked = true; // 锁定防止操作
                if (!game.isCustom) {
                    uploadScore(10);
                    showMsg("🎉 算对啦！积分 +10", "success");
                } else {
                    showMsg("🎉 成功！(自定义不加分)", "success");
                }
                
                // 1秒后自动下一题
                setTimeout(() => {
                    newGame();
                }, 1200);
            } else {
                showMsg(`❌ 结果是 ${fmt(game.cards[0].val)}，不对哦`, "error");
                setTimeout(resetGame, 1500);
            }
        }
    }

    function fmt(n) { return parseFloat(n.toFixed(3)); }


    // 关键修改点：在 doMath 的胜利逻辑里调用 uploadScore(10)
    /* function doMath(...) {
           ...
           if (win) {
               if(!game.isCustom) uploadScore(10); // <--- 这里改为调用云端上传
               ...
           }
       }
    */

   // 辅助函数
   function showLoginModal(canClose) { 
       openModal('login-modal'); 
       if(!canClose) document.getElementById('overlay').onclick=null; 
   }
   function openModal(id) { document.getElementById('overlay').style.display='block'; document.getElementById(id).style.display='block'; }
   function closeModal() { document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); document.getElementById('overlay').style.display='none'; }

   function showHistory() {
        if (!currentUser) return;
        const u = currentUser;
        const list = document.getElementById('history-list');
        document.getElementById('history-title').innerText = `📅 ${u.username} 的记录`;
        list.innerHTML = '';
        
        const dates = Object.keys(u.history || {}).sort((a,b) => new Date(b) - new Date(a));
        if (dates.length === 0) list.innerHTML = '<li style="text-align:center;color:#999;padding:10px;">暂无记录</li>';
        
        dates.forEach(d => {
            const li = document.createElement('li');
            li.className = 'rank-item';
            li.innerHTML = `<span>${d}</span> <b style="color:var(--secondary)">+${u.history[d]}分</b>`;
            list.appendChild(li);
        });
        openModal('history-modal');
    }
</script>
